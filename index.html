<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Rebees Management — Sales Dashboard</title>
<style>
/* -- CSS Variables ----------------------------------------------------------- */
:root{
  --bg:#0d0d1a;
  --bg-grad:linear-gradient(165deg,#0d0d1a 0%,#1a1a2e 40%,#16213e 100%);
  --surface:rgba(255,255,255,.04);
  --surface2:rgba(255,255,255,.03);
  --surface3:rgba(255,255,255,.05);
  --surface-h:rgba(255,255,255,.07);
  --bd:rgba(255,255,255,.07);
  --bd2:rgba(255,255,255,.12);
  --text:#e0e0e0;
  --text2:#bbb;
  --text3:#999;
  --text4:#778;
  --input-bg:rgba(255,255,255,.04);
  --input-bd:rgba(255,255,255,.12);
  --input-text:#e0e0e0;
  --modal-bg:linear-gradient(165deg,#111122,#1a1a2e);
  --overlay:rgba(0,0,0,.78);
  --tt-bg:rgba(12,12,28,.97);
  --tt-bd:rgba(255,255,255,.14);
  --sc-track:rgba(255,255,255,.02);
  --sc-thumb:rgba(255,255,255,.14);
  --ftr:#556;
}
body.light-mode{
  --bg:#f4f5fb;
  --bg-grad:linear-gradient(165deg,#f4f5fb 0%,#ecedfa 40%,#e6e8f7 100%);
  --surface:rgba(255,255,255,.95);
  --surface2:rgba(255,255,255,.8);
  --surface3:rgba(255,255,255,1);
  --surface-h:rgba(0,0,0,.04);
  --bd:rgba(0,0,0,.08);
  --bd2:rgba(0,0,0,.14);
  --text:#1a1a2e;
  --text2:#2d3561;
  --text3:#555;
  --text4:#778;
  --input-bg:rgba(0,0,0,.04);
  --input-bd:rgba(0,0,0,.14);
  --input-text:#1a1a2e;
  --modal-bg:linear-gradient(165deg,#f4f5fb,#ecedfa);
  --overlay:rgba(0,0,0,.45);
  --tt-bg:rgba(255,255,255,.99);
  --tt-bd:rgba(0,0,0,.13);
  --sc-track:rgba(0,0,0,.03);
  --sc-thumb:rgba(0,0,0,.16);
  --ftr:#889;
}

/* -- Base -------------------------------------------------------------------- */
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100vh;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;color:var(--text);transition:background .25s,color .25s}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--sc-track)}
::-webkit-scrollbar-thumb{background:var(--sc-thumb);border-radius:3px}
#root{min-height:100vh;background:var(--bg-grad);padding:24px 20px;transition:background .25s}

/* -- Header ------------------------------------------------------------------ */
.hdr{max-width:1400px;margin:0 auto 20px}
.hdr-inner{display:flex;align-items:flex-start;gap:20px;flex-wrap:wrap}
.brand-left{flex-shrink:0;padding-top:4px}
.brand-wordmark{font-size:24px;font-weight:800;color:#7C2234;letter-spacing:-.3px;line-height:1}
.hdr .sub{font-size:12px;font-weight:500;color:var(--text4);margin-top:4px;letter-spacing:.2px}
.hdr-tabs-area{flex:1;min-width:0}
.prop-tabs{display:flex;gap:8px;flex-wrap:wrap}
.prop-tab{padding:9px 18px;border-radius:10px;border:2px solid var(--bd);cursor:pointer;background:var(--surface);text-align:left;min-width:148px;transition:all .2s;color:inherit}
.prop-tab:hover{border-color:var(--bd2);background:var(--surface-h)}
.prop-tab .pname{font-size:13px;font-weight:700;color:var(--text2);margin-bottom:3px}
.prop-tab .pmeta{font-size:10px;color:var(--text4);display:flex;align-items:center;gap:5px}
.prop-tab.active .pname{color:var(--pc)}
.prop-tab.active{border-color:var(--pc) !important;background:color-mix(in srgb,var(--pc) 12%,transparent)}
.theme-toggle{margin-left:auto;flex-shrink:0;align-self:center;display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:20px;border:1px solid var(--bd2);background:var(--surface);color:var(--text3);font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s;white-space:nowrap}
.theme-toggle:hover{background:var(--surface-h);color:var(--text)}
.owner-tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.owner-tool-btn{display:flex;align-items:center;gap:7px;padding:7px 14px;border-radius:8px;border:1px solid var(--bd2);background:var(--surface);color:var(--text3);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s}
.owner-tool-btn:hover{border-color:var(--bd2);background:var(--surface-h);color:var(--text)}
.owner-banner{display:flex;align-items:center;gap:14px;padding:14px 20px;border-radius:12px;border:1px solid color-mix(in srgb,var(--pc) 35%,transparent);background:color-mix(in srgb,var(--pc) 10%,transparent)}
.owner-banner .ob-icon{font-size:28px}
.owner-banner .ob-name{font-size:18px;font-weight:700;color:var(--pc)}
.owner-banner .ob-meta{font-size:11px;color:var(--text4);margin-top:2px}

/* -- KPIs -------------------------------------------------------------------- */
.inner{max-width:1400px;margin:0 auto}
.kpi-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.kpi{background:var(--surface);border-radius:10px;padding:8px 16px;border:1px solid var(--bd)}
.kpi .kl{font-size:9px;color:var(--text4);text-transform:uppercase;letter-spacing:.5px;font-weight:700}
.kpi .kv{font-size:18px;font-weight:700;color:var(--text);margin-top:1px}

/* -- Layout / Sidebar -------------------------------------------------------- */
.layout{display:grid;grid-template-columns:256px 1fr;gap:18px;align-items:start}
.sidebar{display:flex;flex-direction:column;gap:10px}
.panel{background:var(--surface2);border-radius:12px;padding:12px;border:1px solid var(--bd)}
.panel-lbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--pc);margin-bottom:6px}
.toggle-row{display:flex;gap:6px}
.tog-btn{flex:1;padding:5px 0;border-radius:6px;border:none;cursor:pointer;font-size:12px;font-weight:600;background:var(--surface);color:var(--text3);transition:all .2s;font-family:inherit}
.tog-btn.on{background:color-mix(in srgb,var(--pc) 30%,transparent);color:var(--pc)}
.yr-grid{display:flex;flex-wrap:wrap;gap:5px}
.yr-btn{padding:5px 12px;border-radius:6px;border:none;cursor:pointer;font-size:12px;font-weight:600;background:var(--surface);color:var(--text3);transition:all .2s;font-family:inherit}
.yr-btn.on{background:rgba(42,157,143,.25);color:#2a9d8f}
.mo-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.mo-link{font-size:10px;background:none;border:none;cursor:pointer;font-weight:600;font-family:inherit;padding:0;color:var(--text3)}
.mo-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.mo-btn{padding:5px 0;border-radius:5px;border:none;cursor:pointer;font-size:11px;font-weight:600;background:var(--surface);color:var(--text3);transition:all .2s;font-family:inherit}
.mo-btn.on{background:rgba(69,123,157,.25);color:#457b9d}
.ten-search{width:100%;padding:6px 10px;border-radius:6px;border:1px solid var(--input-bd);background:var(--input-bg);color:var(--input-text);font-size:12px;margin-bottom:6px;outline:none;font-family:inherit}
.ten-list{overflow-y:auto;max-height:340px;display:flex;flex-direction:column;gap:2px}
.ten-item{display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:6px;cursor:pointer;transition:background .15s}
.ten-item:hover{background:var(--surface-h)}
.ten-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}
.ten-info{overflow:hidden;flex:1}
.ten-name{font-size:11px;font-weight:500;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ten-sf{font-size:9px;color:var(--text3)}
.cat-badge{font-size:8px;font-weight:700;padding:2px 6px;border-radius:4px;white-space:nowrap;flex-shrink:0}
.show-more{margin-top:6px;padding:4px 0;background:none;border:none;color:#457b9d;font-size:11px;cursor:pointer;font-weight:600;font-family:inherit;width:100%}

/* -- Chart Area -------------------------------------------------------------- */
.right{display:flex;flex-direction:column;gap:14px}
.chart-panel{background:var(--surface2);border-radius:14px;padding:18px;border:1px solid var(--bd)}
.ctrl-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px}
.ctrl-grp{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ctrl-lbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text4);margin-right:4px}
.view-btn{padding:5px 14px;border-radius:20px;border:1px solid var(--bd);cursor:pointer;font-size:11px;font-weight:600;font-family:inherit;background:var(--surface);color:var(--text3);transition:all .2s}
.view-btn.on{border-color:var(--btn-c);background:color-mix(in srgb,var(--btn-c) 15%,transparent);color:var(--btn-c)}
.metric-btn{padding:5px 14px;border-radius:20px;border:1px solid var(--bd);cursor:pointer;font-size:11px;font-weight:600;font-family:inherit;background:var(--surface);color:var(--text3);transition:all .2s}
.metric-btn.on{border-color:#e9c46a80;background:rgba(233,196,106,.18);color:#c8920a}

/* -- Totals Panel ------------------------------------------------------------ */
.tot-panel{background:var(--surface2);border-radius:14px;padding:14px;border:1px solid var(--bd)}
.tot-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:8px}
.tot-lbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--pc)}
.tot-legend{display:flex;gap:12px;font-size:9px;color:var(--text4)}
.tot-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:8px}
.tot-card{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;cursor:pointer;transition:all .15s;border:1px solid transparent}
.tot-card:hover{background:var(--surface-h) !important}
.tot-bar{width:5px;height:36px;border-radius:3px;flex-shrink:0}
.tot-body{flex:1;overflow:hidden}
.tot-name-row{display:flex;align-items:center;gap:5px;margin-bottom:2px}
.tot-name{font-size:11px;font-weight:600;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tot-val{font-size:13px;font-weight:700;color:var(--text)}
.tot-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.rev-score{text-align:center}
.rev-score .rl{font-size:8px;color:var(--text4);margin-bottom:3px}
.rev-score .rv{font-size:13px;font-weight:700;color:var(--text)}
.occ-right{text-align:right}
.occ-right .ol{font-size:8px;color:var(--text4);margin-bottom:3px}
.occ-badge{display:inline-flex;align-items:center;gap:3px;border-radius:5px;padding:1px 5px;font-size:9px;font-weight:700}

/* -- Modal ------------------------------------------------------------------- */
.overlay{position:fixed;inset:0;background:var(--overlay);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--modal-bg);border-radius:16px;padding:24px;width:min(920px,100%);max-height:90vh;overflow-y:auto;box-shadow:0 24px 60px rgba(0,0,0,.4)}
.modal-hdr{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px}
.modal-title-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.modal-close{background:var(--surface3);border:1px solid var(--bd);border-radius:8px;color:var(--text3);font-size:18px;cursor:pointer;padding:4px 10px;line-height:1;flex-shrink:0}
.modal-close:hover{color:var(--text)}
.modal-stats{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.stat-box{background:var(--surface3);border-radius:8px;padding:5px 12px;border:1px solid var(--bd)}
.stat-l{font-size:8px;color:var(--text4);text-transform:uppercase;letter-spacing:.5px;font-weight:700}
.stat-v{font-size:14px;font-weight:700;color:var(--text)}
.modal-body{display:flex;flex-direction:column;gap:16px}
.chart-section{background:var(--surface);border-radius:12px;padding:14px 16px;border:1px solid var(--bd)}
.section-lbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px}
.yoy-strip{display:flex;gap:6px;margin-top:8px;padding-top:8px;border-top:1px solid var(--bd);flex-wrap:wrap}
.yoy-chip{display:flex;align-items:center;gap:4px;background:var(--surface);border-radius:5px;padding:3px 8px}
.yoy-yr{font-size:9px;color:var(--text4)}
.yoy-val{font-size:9px;font-weight:700;margin-left:4px;white-space:nowrap}
.reviews-panel{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.plat-card{background:var(--surface3);border-radius:10px;padding:14px 16px;border:1px solid var(--bd);text-align:center}
.plat-icon{font-size:20px;margin-bottom:4px}
.plat-name{font-size:9px;font-weight:700;color:var(--text4);text-transform:uppercase;margin-bottom:8px}
.plat-score{display:flex;align-items:center;justify-content:center;gap:4px;margin-bottom:3px}
.score-num{font-size:26px;font-weight:800;color:var(--text)}
.score-star{font-size:16px;color:#e9c46a;margin-top:2px}
.score-ct{font-size:9px;color:var(--text4)}
.edit-row{display:flex;align-items:center;gap:8px;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--bd)}
.avg-score{flex:1}
.avg-lbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text4);margin-bottom:4px}
.avg-val{display:flex;align-items:baseline;gap:6px}
.avg-num{font-size:32px;font-weight:800;color:var(--text);line-height:1}
.edit-btn{padding:4px 12px;border-radius:6px;border:1px solid var(--bd2);background:var(--surface);color:var(--text3);font-size:10px;font-weight:600;cursor:pointer;font-family:inherit}
.edit-inputs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.edit-card{background:var(--surface);border-radius:10px;padding:10px 12px;border:1px solid var(--bd)}
.edit-card-lbl{font-size:9px;font-weight:700;color:var(--text4);text-transform:uppercase;margin-bottom:8px;text-align:center}
.edit-card input{width:100%;padding:4px 6px;border-radius:4px;border:1px solid var(--input-bd);background:var(--input-bg);color:var(--input-text);font-size:12px;text-align:center;box-sizing:border-box;font-family:inherit;outline:none;margin-bottom:4px}
.hist-hdr{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px}
.hist-yr-sum{display:flex;gap:16px}
.hist-yr{text-align:right}
.hist-yr .hy{font-size:8px;color:var(--text4);text-transform:uppercase}
.hist-yr .hv{font-size:12px;font-weight:700;color:var(--text2)}

/* -- Misc -------------------------------------------------------------------- */
.no-data{text-align:center;padding:48px 0;color:var(--text3);font-size:13px}
#tt{position:fixed;pointer-events:none;z-index:9999;display:none;background:var(--tt-bg);border:1px solid var(--tt-bd);border-radius:10px;padding:10px 14px;min-width:160px;max-width:280px;box-shadow:0 8px 32px rgba(0,0,0,.5)}
.ftr{text-align:center;margin-top:24px;padding-bottom:16px;color:var(--ftr);font-size:11px}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:400px;gap:16px;color:var(--text3)}
.empty-icon{font-size:48px;opacity:.3}
.empty-title{font-size:16px;font-weight:600;color:var(--text3)}
.empty-desc{font-size:12px;color:var(--text4);text-align:center;max-width:360px;line-height:1.6}

/* -- Light mode SVG / inline-style overrides --------------------------------- */
body.light-mode #tt{color:#1a1a2e}
body.light-mode .chart-section svg text{fill:#555}
body.light-mode .chart-section svg line{stroke:rgba(0,0,0,.08)}
body.light-mode .chart-panel svg text{fill:#555}
body.light-mode .chart-panel svg line{stroke:rgba(0,0,0,.08)}
</style>
</head>
<body>
<div id="root"></div>
<div id="tt"></div>
<script src="dashboard.js"></script>
</body>
</html>
